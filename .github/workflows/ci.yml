name: CI

# Static checks on every pull request and on pushes to main. Nothing here
# builds or releases; it only gates code quality and workflow security so a
# regression cannot reach main unreviewed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default to no privileges; each job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest. Print every finding for
      # visibility, but only fail the job on error-level issues. Pre-existing
      # info/warning items in build.sh are intentional (client-side ssh
      # heredoc expansion) and tracked separately.
      - name: Run shellcheck
        run: |
          shellcheck ./*.sh || true
          echo "--- gating on error severity ---"
          shellcheck --severity=error ./*.sh

  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # php-cli is preinstalled on ubuntu-latest. Lint every PHP source the
      # package ships (GUI pages and pfSense .inc includes).
      - name: php -l all PHP sources
        run: |
          find files \( -name '*.php' -o -name '*.inc' \) -print0 \
            | xargs -0 -r -n1 php -l

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # actionlint only lints these workflows and never touches the shipped
      # package, so it tracks the latest release rather than a pinned version
      # (nothing to silently drift). Integrity is still enforced: the tarball
      # is verified against the checksum published in that same release before
      # it is executed.
      - name: Install and run actionlint (latest, checksum-verified)
        env:
          # Authenticated API calls avoid the shared-runner anonymous rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/rhysd/actionlint/releases/latest \
            | grep '"tag_name"' | head -1 | sed -E 's/.*"tag_name": *"v?([^"]+)".*/\1/')
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected actionlint release tag: '${TAG}'" >&2
            exit 1
          fi
          BASE="https://github.com/rhysd/actionlint/releases/download/v${TAG}"
          TARBALL="actionlint_${TAG}_linux_amd64.tar.gz"
          curl -fsSL -o "${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o checksums.txt "${BASE}/actionlint_${TAG}_checksums.txt"
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" actionlint
          ./actionlint -color

  workflow-security:
    name: zizmor (Actions SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # zizmor statically audits the workflows for the same class of issues
      # this repo already guards by hand (template injection, unpinned actions,
      # credential persistence, over-broad permissions).
      - name: Install zizmor
        run: pip install -r .github/zizmor/requirements.txt

      - name: Audit workflows
        run: zizmor --offline --min-severity=low .github/workflows/
