version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps the pinned
  # digest and updates the trailing version comment, so pinning does not mean
  # going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
